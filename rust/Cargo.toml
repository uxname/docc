[package]
name = "docc"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22.1"
hex = "0.4.3"
jsonschema = { version = "0.58.6", default-features = false }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
unicode-normalization = "0.1.25"
url = "2.5.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
