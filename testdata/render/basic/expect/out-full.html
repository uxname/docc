<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index</title>
<style>
:root{color-scheme:light dark;
--bg:#fff;--bg2:#f6f7f9;--fg:#1c2128;--muted:#5d6875;--line:#e2e5ea;--accent:#2f5fd0;--accent-bg:#eaf0fd;--code:#f1f3f6;
--ok:#1a7f45;--ok-bg:#e3f5ea;--warn:#a15c00;--warn-bg:#fdf1d8;--bad:#b42323;--bad-bg:#fbe7e7;--shadow:0 6px 24px rgba(20,30,50,.12);
--chg:#6d28d9;--chg-bg:#f1ebfd;--on-accent:#fff;--field:#7a8592}
@media (prefers-color-scheme:dark){:root{
--bg:#0f1318;--bg2:#161b22;--fg:#e4e8ee;--muted:#9aa5b1;--line:#2b323b;--accent:#6c9bff;--accent-bg:#1a2742;--code:#1b2129;
--ok:#4cc17f;--ok-bg:#12301f;--warn:#e5a93b;--warn-bg:#3a2d0f;--bad:#f07a7a;--bad-bg:#3a1717;--shadow:0 6px 24px rgba(0,0,0,.5);
--chg:#b794f6;--chg-bg:#251a3d;--on-accent:#0f1318;--field:#6b7684}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:9rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:.15em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.skip{position:absolute;left:-999px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip:focus{left:1rem;top:1rem;z-index:30;background:var(--bg);padding:.5rem 1rem;box-shadow:var(--shadow)}
.bar{display:none}
.shell{display:grid;grid-template-columns:17.5rem minmax(0,1fr) 15rem;min-height:100vh}
/* sidebar */
#side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg2);border-right:1px solid var(--line);padding:1rem .9rem 2rem;font-size:.9rem;line-height:1.45}
.search{position:relative}
#q{width:100%;padding:.55rem .8rem;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--field);border-radius:.55rem}
#q:focus{border-color:var(--accent)}
#results{position:absolute;left:0;right:0;top:calc(100% + .35rem);z-index:20;margin:0;padding:.3rem;list-style:none;max-height:70vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:.6rem;box-shadow:var(--shadow)}
#results ul{margin:0;padding:0;list-style:none}
#results .count{margin:.2rem .6rem .3rem;color:var(--muted);font-size:.8rem}
#results li{padding:.5rem .6rem;border-radius:.4rem;cursor:pointer}
#results li[aria-selected=true],#results li:hover{background:var(--accent-bg)}
#results b{display:block;font-weight:600}
#results span{display:block;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
#results mark{background:var(--warn-bg);color:inherit;border-radius:2px}
#tree h2{margin:1.4rem 0 .4rem;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#tree .gt{display:flex;width:100%;gap:.4rem;align-items:center;padding:0;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
#tree .gt::before{content:"▾";transition:transform .12s}
#tree .gt[aria-expanded=false]::before{transform:rotate(-90deg)}
#tree .gt span{margin-left:auto;padding:0 .45rem;font-weight:400;background:var(--line);border-radius:99px}
#tree .gh.closed+.gb{display:none}
#tree ul{margin:0;padding:0;list-style:none}
#tree ul ul{margin-left:.55rem;padding-left:.6rem;border-left:1px solid var(--line)}
#tree li{position:relative}
#tree a{display:block;padding:.28rem .5rem .28rem 1.5rem;border-radius:.4rem;color:var(--fg);text-decoration:none}
#tree a:hover{background:var(--accent-bg)}
#tree a[aria-current=page]{background:var(--accent-bg);color:var(--accent);font-weight:600}
.tw{position:absolute;left:0;top:.3rem;width:1.4rem;height:1.4rem;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:.3rem}
.tw::before{content:"▾";display:block;transition:transform .12s}
.tw[aria-expanded=false]::before{transform:rotate(-90deg)}
.tw[aria-expanded=false]~ul{display:none}
.banner{margin:.9rem 0 0;padding:.5rem .7rem;font-size:.82rem;border-radius:.5rem;background:var(--warn-bg);color:var(--warn)}
/* page */
main{padding:2.5rem 3rem 5rem;max-width:52rem;width:100%;margin:0 auto;outline:0}
.crumbs{display:flex;flex-wrap:wrap;gap:.4rem;font-size:.85rem;color:var(--muted);margin-bottom:.6rem}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent);text-decoration:underline}
h1{margin:0 0 1rem;font-size:2.2rem;line-height:1.2;letter-spacing:-.02em;font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 1.6rem}
.badge,.tag{display:inline-block;padding:.05rem .6rem;font-size:.78rem;line-height:1.6;border-radius:99px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);white-space:nowrap}
.badge.kind{background:var(--accent-bg);border-color:transparent;color:var(--accent);font-weight:600}
.badge.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.badge.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.badge.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.tag{border-style:dashed}
.doc{overflow-wrap:break-word}
.doc>p:first-child{font-size:1.14rem;line-height:1.65}
.doc p,.doc ul,.doc ol,.doc table,.doc pre,.doc blockquote{margin:0 0 1.1rem}
.doc h2{position:relative;margin:2.4rem 0 .8rem;padding-top:1.2rem;border-top:1px solid var(--line);font-size:1.35rem;line-height:1.3;letter-spacing:-.01em}
.doc h2 .anchor,.doc h3 .anchor,.doc h4 .anchor{position:absolute;left:-1.3rem;color:var(--muted);text-decoration:none;opacity:0}
.doc :is(h2,h3,h4):hover .anchor,.doc :is(h2,h3,h4) .anchor:focus{opacity:1}
.doc h3,.doc h4{position:relative;margin:1.8rem 0 .6rem;line-height:1.3}
.doc h3{font-size:1.15rem}
.doc h4{font-size:1rem}
.doc dl{display:grid;grid-template-columns:minmax(7rem,13rem) 1fr;gap:.6rem 1.2rem;margin:0 0 1.4rem;padding:1rem 1.2rem;background:var(--bg2);border:1px solid var(--line);border-radius:.7rem}
.doc dt{color:var(--muted);font-size:.9rem;padding-top:.1rem}
.doc dd{margin:0}
.doc dd p{margin:0}
.doc li{margin:.25rem 0}
.doc ul,.doc ol{padding-left:1.5rem}
.doc li>ul,.doc li>ol{margin:.25rem 0}
code,pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.88em}
code{padding:.12em .38em;background:var(--code);border-radius:.3rem}
pre{position:relative;padding:1rem 1.1rem;overflow-x:auto;background:var(--code);border:1px solid var(--line);border-radius:.6rem;line-height:1.55}
pre code{padding:0;background:none}
.copy{position:absolute;top:.5rem;right:.5rem;padding:.15rem .55rem;font:inherit;font-size:.75rem;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:.35rem;cursor:pointer;opacity:0}
pre:hover .copy,.copy:focus{opacity:1}
table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;font-size:.92rem}
th{background:var(--bg2);font-weight:600}
th,td{padding:.55rem .85rem;border:1px solid var(--line);text-align:left;vertical-align:top}
tbody tr:nth-child(even){background:var(--bg2)}
blockquote{padding:.6rem 1rem;border-left:.25rem solid var(--accent);background:var(--accent-bg);border-radius:0 .5rem .5rem 0;color:var(--fg)}
blockquote p{margin:0}
.rh{margin:2.6rem 0 .8rem;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rows{border:1px solid var(--line);border-radius:.7rem;overflow:hidden}
.row{display:block;padding:.8rem 1.1rem;color:inherit;text-decoration:none;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-bg)}
.ct{font-weight:600;color:var(--accent)}
.ct .badge{margin-left:.4rem;vertical-align:.1em}
.cs{display:block;margin-top:.2rem;font-size:.92rem;line-height:1.55;color:var(--muted)}
.extra{display:none!important}
.more{display:block;width:100%;padding:.55rem;font:inherit;font-size:.88rem;color:var(--accent);background:var(--bg2);border:0;border-top:1px solid var(--line);cursor:pointer}
.more:hover{background:var(--accent-bg)}
.rg .more{display:inline-block;width:auto;padding:.12rem .7rem;border:1px dashed var(--line);border-radius:99px;background:none}
#tree .more{margin-top:.3rem;border:1px dashed var(--line);border-radius:.4rem;padding:.3rem}
.related{display:grid;gap:.6rem}
.rg{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem .5rem}
.rl{min-width:7.5rem;font-size:.85rem;color:var(--muted)}
.chip{display:inline-block;padding:.12rem .7rem;font-size:.88rem;text-decoration:none;color:var(--accent);background:var(--accent-bg);border-radius:99px}
.chip:hover{text-decoration:underline}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:3rem}
.pn a{display:flex;flex-direction:column;gap:.1rem;padding:.8rem 1rem;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:.7rem}
.pn a:hover{border-color:var(--accent)}
.pn small{color:var(--muted)}
.pn span{color:var(--accent);font-weight:600}
.pn .next{grid-column:2;text-align:right}
.pn .prev{grid-column:1}
/* blocks: tools on hover, comments, history, changes */
.ttl{display:flex;flex-wrap:wrap;align-items:flex-start;gap:0 1rem}
.ttl h1{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.ph-b,.toolbar button,.ed-row button,.menu button{padding:.25rem .7rem;font-size:.85rem;background:var(--bg);border:1px solid var(--line);border-radius:.45rem;white-space:nowrap}
.ph-b{margin-top:.6rem}
.ph-b:hover,.toolbar button:hover,.ed-row button:hover,.menu button:hover,.toolbar button.on{border-color:var(--accent);color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.pri:hover{color:var(--on-accent)}
button:disabled{opacity:.45;cursor:default}
button.link{padding:0;border:0;background:none;color:var(--accent);font-size:.82rem}
.sp{flex:1}
.muted{color:var(--muted);font-size:.88rem}
.toolbar{position:sticky;top:0;z-index:10;display:flex;flex-direction:column;gap:.4rem;margin:-1.2rem 0 1.2rem;padding:.5rem 0;background:var(--bg);border-bottom:1px solid var(--line);font-size:.88rem}
.tb-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.since-l{display:flex;align-items:center;gap:.4rem;min-width:0;color:var(--muted)}
.since-l select{min-width:0;max-width:20rem;padding:.2rem .4rem;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--field);border-radius:.45rem}
.chg-nav{display:flex;align-items:center;gap:.3rem}
.toolbar .chg-nav button{color:var(--chg);border-color:var(--chg)}
.pos{min-width:4.5rem;text-align:center;color:var(--muted)}
.ver-l{color:var(--muted)}
.chg-list{margin:0;padding:0;list-style:none}
.chg-list li{display:flex;flex-wrap:wrap;gap:.2rem .7rem;align-items:baseline;padding:.35rem 0;border-top:1px solid var(--line)}
.chg-list small{color:var(--muted)}
.panel{margin:0 0 1.2rem;padding:1rem 1.1rem;background:var(--bg2);border:1px solid var(--line);border-radius:.7rem}
.menu{display:flex;flex-wrap:wrap;gap:.5rem}
.hh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem}
.pc{margin:.8rem 0 0}
.ptr{margin-left:.5rem;color:var(--muted);font-size:.8rem}
.blk{position:relative;margin:0 -.8rem;padding:0 .8rem;border-left:3px solid transparent;border-radius:.3rem}
.blk:hover{background:var(--bg2)}
.blk.chg{border-left-color:var(--chg)}
.blk.new{border-left-color:var(--chg);border-left-style:dashed}
.blk.flash{outline:2px solid var(--accent);outline-offset:2px}
dd.blk{margin:0;padding:0 .4rem}
.tools{position:absolute;top:.1rem;right:-.4rem;display:flex;gap:.2rem;opacity:0;transition:opacity .1s}
.blk:hover>.tools,.blk.has-c>.tools,.blk.chg>.tools,.blk.new>.tools,.tools:focus-within{opacity:1}
/* tools that stay visible get a row of their own, so they never cover the text */
.blk.has-c>.tools,.blk.chg>.tools,.blk.new>.tools{position:static;justify-content:flex-end;margin:-.5rem 0 .5rem}
.tools button{min-height:1.75rem;padding:.05rem .45rem;font-size:.8rem;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:.4rem}
.tools button:hover{border-color:var(--accent)}
.tools .chg-b{color:var(--chg);border-color:var(--chg)}
.tag-new{align-self:center;padding:0 .45rem;font-size:.75rem;color:var(--chg);border:1px dashed var(--chg);border-radius:.4rem;background:var(--bg)}
.note{margin:.4rem 0 .8rem;padding:.5rem .8rem;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:.5rem;font-size:.92rem}
.note.repo{background:var(--bg2)}
.nh{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline}
.nh small{color:var(--muted)}
.acts{display:flex;gap:.8rem;margin-left:auto}
.reply{margin-top:.4rem;padding-top:.4rem;border-top:1px dashed var(--line)}
.reply small{display:block;color:var(--muted)}
.nt{white-space:pre-wrap}
.editor{margin:.4rem 0 1rem;padding:.7rem;background:var(--bg);border:1px solid var(--accent);border-radius:.6rem}
.who-l{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;color:var(--muted);font-size:.88rem}
.editor .who{flex:1;max-width:16rem;padding:.3rem .5rem}
.editor textarea{display:block;width:100%;margin-bottom:.5rem;padding:.5rem .6rem}
.editor textarea,.editor .who{font:inherit;font-size:1rem;color:var(--fg);background:var(--bg);border:1px solid var(--field);border-radius:.45rem}
.editor textarea{resize:vertical}
.ed-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.mic-w{display:flex;align-items:center;gap:.5rem}
.mic{user-select:none;touch-action:none}
.mic.on{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.err{color:var(--bad)}
.hist{margin:.4rem 0 1rem;padding:.7rem .9rem;background:var(--bg);border:1px solid var(--line);border-radius:.6rem;font-size:.92rem}
.page-hist{margin:0 0 1.4rem}
.ver{padding:.5rem 0;border-top:1px solid var(--line)}
.vh{color:var(--muted);font-size:.82rem;margin-bottom:.25rem}
.dv{white-space:pre-wrap;overflow-wrap:anywhere}
.dv ins{background:var(--ok-bg);color:var(--ok);text-decoration:underline;text-decoration-thickness:1px}
.dv del{background:var(--bad-bg);color:var(--bad)}
.dv.whole del,.dv.whole ins{display:block;padding:.2rem .4rem;border-radius:.3rem}
.dv.whole del{margin-bottom:.3rem}
.dv.whole ins{text-decoration:none}
.since{margin:.2rem 0 .8rem;padding:.5rem .7rem;background:var(--bg);border:1px dashed var(--chg);border-radius:.5rem;font-size:.92rem}
.since>small{display:block;color:var(--muted)}
.gone{margin:1.4rem 0;padding:.6rem .9rem;border:1px dashed var(--chg);border-radius:.6rem;font-size:.92rem}
.gone summary{cursor:pointer;color:var(--chg)}
.gone .dv{margin-top:.5rem}
.notice{margin:0 0 1.2rem;padding:.6rem .9rem;background:var(--warn-bg);color:var(--fg);border-radius:.5rem}
.toast-w{position:fixed;left:50%;bottom:1.2rem;z-index:40;transform:translateX(-50%);max-width:calc(100vw - 2rem)}
.toast{display:flex;gap:1rem;align-items:baseline;padding:.6rem 1rem;background:var(--fg);color:var(--bg);border-radius:.6rem;box-shadow:var(--shadow)}
.toast .link{color:var(--bg);text-decoration:underline;font-size:inherit}
.side-x{display:none}
.scrim{display:none}
.pg-g{margin:.3rem 0}
.pg-g>small{color:var(--muted);text-transform:uppercase;font-size:.7rem;letter-spacing:.06em}
.pg-i{margin:.2rem 0 .4rem}
.pg-i .ptr{margin:0;display:block}
.cnt{display:inline-block;margin-left:.3rem;padding:0 .4rem;font-size:.72rem;line-height:1.5;color:var(--chg);border:1px solid var(--chg);border-radius:99px}
.noscript{padding:2rem}
/* table of contents */
#toc{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:2.6rem 1rem 2rem 0;font-size:.85rem;line-height:1.4}
#toc[hidden]{display:none}
#toc h2{margin:0 0 .5rem;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#toc a{display:block;padding:.25rem 0 .25rem .8rem;color:var(--muted);text-decoration:none;border-left:2px solid var(--line)}
#toc a:hover{color:var(--fg)}
#toc a.l3{padding-left:1.6rem}
#toc a.l4{padding-left:2.4rem}
#toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:600}
@media (max-width:1200px){.shell{grid-template-columns:17.5rem minmax(0,1fr)}#toc{display:none}}
@media (max-width:820px){
html{scroll-padding-top:5rem}
.shell{display:block}
.bar{display:flex;align-items:center;gap:.7rem;position:sticky;top:0;z-index:15;padding:.5rem .8rem;background:var(--bg);border-bottom:1px solid var(--line)}
.bar button{min-width:2.75rem;min-height:2.75rem;font:inherit;font-size:1.2rem;color:inherit;background:none;border:1px solid var(--line);border-radius:.4rem;padding:.1rem .6rem;cursor:pointer}
#side{position:fixed;z-index:25;left:0;top:0;bottom:0;width:min(20rem,88vw);height:auto;transform:translateX(-102%);visibility:hidden;transition:transform .18s,visibility .18s;box-shadow:var(--shadow)}
#side.open{transform:none;visibility:visible}
.side-x{display:block;margin:0 0 .8rem auto;min-height:2.75rem;padding:.2rem .8rem;background:var(--bg);border:1px solid var(--line);border-radius:.45rem}
.side-brand{display:none}
.scrim{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35)}
.toolbar{position:static;margin-top:0}
.since-l{flex:1 1 100%;flex-wrap:wrap}
.chg-nav{flex:1 1 100%;min-width:0}
.toolbar .chg-nav>button:first-child{flex:1;min-width:0;white-space:normal;text-align:left}
.pos{min-width:3.5rem}
.since-l select{flex:1 1 100%;max-width:none}
.ttl h1{flex:1 1 100%}
.ph-b{margin:0 0 .4rem}
main{padding:1.5rem 1.1rem 4rem}
h1{font-size:1.8rem}
.doc h2 .anchor,.doc h3 .anchor,.doc h4 .anchor{display:none}
.pn{grid-template-columns:1fr}
.pn .next{grid-column:1}
}
/* touch: no hover, so the actions of a paragraph are always there and big enough */
@media (hover:none){
.tools{position:static;justify-content:flex-end;opacity:1;margin:-.3rem 0 .6rem}
.tools button{min-height:2.75rem;min-width:2.75rem;padding:.1rem .7rem;font-size:.9rem}
.blk:hover{background:none}
.tw{width:2.4rem;height:2.4rem;top:-.1rem;left:-.5rem}
}
@media print{
.bar,#side,#toc,.skip,.copy,.pn,.scrim,.toast-w,.notice,.gone,.tag-new{display:none!important}
.shell{display:block}
main{max-width:none;padding:0}
.toolbar,.panel,.tools,.ph-b,.editor,.hist{display:none!important}
.blk.chg{border-color:transparent!important}
a{color:inherit;text-decoration:none}
.row,.chip{border:1px solid var(--line)}
}

// The documentation application: one page at a time drawn from the JSON

// Labels are marked as t:English in double braces and translated by the build (lang.go).

        ${commits.length > 0 && html`<button type="button" class="ph-b" aria-expanded=${ph[0] ? 'true' : 'false'} onClick=${function () { ph[1](!ph[0]); }}>🕘 Page history</button>`}
      </div>
      ${(page.kind || page.status || page.priority || page.hidden || page.tags) && html`<div class="badges">
        ${page.kind && html`<span class="badge kind">${page.kind}</span>`}
        ${page.status && html`<span class=${'badge ' + (page.sc || '')}>${page.status}</span>`}
        ${page.priority && html`<span class="badge">priority ${page.priority}</span>`}
        ${page.hidden && html`<span class="badge bad">hidden</span>`}
        ${(page.tags || []).map(function (t) { return html`<span class="tag">#${t}</span>`; })}
      </div>`}
      ${ph[0] && html`<${PageHistory} page=${page} close=${function () { ph[1](false); }} />`}
      <div class="doc">
        ${page.props && html`<dl>${page.props.map(function (p) {
          return html`<dt>${p.k}</dt><${Block} ...${bl} b=${p} tag="dd" id=${p.id} />`;
        })}</dl>`}
        ${(page.blocks || []).map(function (b) { return html`<${Block} ...${bl} b=${b} />`; })}
      </div>
      ${gone.length > 0 && html`<details class="gone"><summary>Removed from this page since the chosen version: ${gone.length}</summary>
        ${gone.map(function (t) { return html`<div class="dv"><del>${plain(t)}</del></div>`; })}</details>`}
      ${page.kids && html`<h2 class="rh">Pages in this section</h2><div class="rows">${page.kids.map(function (id) {
        var k = byId[id];
        return k && html`<a class="row" href=${'#' + id}><span class="ct">${k.title}${k.kind && html` <span class="badge kind">${k.kind}</span>`}</span>${k.summary && html`<span class="cs">${k.summary}</span>`}</a>`;
      })}</div>`}
      ${(refs.length || page.covers) && html`<h2 class="rh">Related</h2><div class="related">
        ${refs.length > 0 && html`<div class="rg"><span class="rl">Referenced by</span>${refs.map(function (id) { return html`<${Chip} id=${id} />`; })}</div>`}
        ${page.covers && html`<div class="rg"><span class="rl">Covered by</span>${page.covers.map(function (c) { return html`<code>${c}</code>`; })}</div>`}
      </div>`}
      ${(prev || next) && html`<nav class="pn" aria-label="Neighbouring pages">
        ${prev && html`<a class="prev" href=${'#' + prev.id}><small>Previous</small><span>${prev.title}</span></a>`}
        ${next && html`<a class="next" href=${'#' + next.id}><small>Next</small><span>${next.title}</span></a>`}
      </nav>`}
      ${D.brand.foot && html`<div dangerouslySetInnerHTML=${{ __html: D.brand.foot }}></div>`}
    </article>`;
  }

  // ---- sidebar: tree and search ----
  function nest(list) {
    var root = { kids: [] }, stack = [root];
    list.forEach(function (e) {
      var node = { id: e[0], kids: [] };
      stack.length = e[1] + 1;
      (stack[e[1]] || root).kids.push(node);
      stack.push(node);
    });
    return root.kids;
  }
  var tree = nest(D.nav.tree), orphans = nest(D.nav.orphans);
  function contains(node, id) {
    return node.id === id || node.kids.some(function (k) { return contains(k, id); });
  }
  // long lists show a window of 30 items with buttons for the rest
  function Items(props) {
    var all = props.nodes, n = all.length, at = -1;
    all.forEach(function (x, k) { if (contains(x, props.cur)) { at = k; } });
    var win = useState(null);
    var lo = 0, hi = Math.min(n, 30);
    if (win[0]) { lo = win[0][0]; hi = win[0][1]; }
    if (at >= 0 && (at < lo || at >= hi)) { lo = Math.max(0, at - 10); hi = Math.min(n, at + 11); }
    return html`<ul>
      ${lo > 0 && html`<li><button type="button" class="more" onClick=${function () { win[1]([Math.max(0, lo - 30), hi]); }}>↑ ${lo} earlier</button></li>`}
      ${all.slice(lo, hi).map(function (x) { return html`<${Node} key=${x.id} node=${x} cur=${props.cur} since=${props.since} />`; })}
      ${hi < n && html`<li><button type="button" class="more" onClick=${function () { win[1]([lo, Math.min(n, hi + 30)]); }}>${n - hi} more ↓</button></li>`}
    </ul>`;
  }
  function Node(props) {
    var x = props.node, p = byId[x.id], inside = contains(x, props.cur);
    var open = useState(null);
    var isOpen = open[0] == null ? inside : open[0];
    useEffect(function () { if (inside) { open[1](null); } }, [props.cur]);
    if (!p) { return null; }
    var d = pageDelta(p, props.since), n = d.list.length + d.rm.length;
    return html`<li class=${x.kids.length ? 'parent' : ''}>
      ${x.kids.length > 0 && html`<button class="tw" type="button" aria-expanded=${isOpen ? 'true' : 'false'}
        aria-label=${(isOpen ? 'Collapse' : 'Expand') + ': ' + p.title} onClick=${function () { open[1](!isOpen); }}></button>`}
      <a href=${'#' + p.id} aria-current=${p.id === props.cur ? 'page' : undefined}>${p.title}${p.hidden && html` <span class="badge bad">hidden</span>`}${n > 0 && html` <span class="cnt" title="Changes on the page"><span class="sr">Changes on the page: </span>${n}</span>`}</a>
      ${x.kids.length > 0 && isOpen && html`<${Items} nodes=${x.kids} cur=${props.cur} since=${props.since} />`}
    </li>`;
  }
  function Group(props) {
    var open = useState(false);
    return html`<h2 class=${'gh' + (open[0] ? '' : ' closed')}><button class="gt" type="button" aria-expanded=${open[0] ? 'true' : 'false'}
      onClick=${function () { open[1](!open[0]); }}>${props.label} <span>${props.n}</span></button></h2>
      ${open[0] && html`<div class="gb">${props.children}</div>`}`;
  }

  // the search finds paragraphs: every word in the paragraph or in the title of its page
  var index = null, LIMIT = 30;
  function Search(props) {
    var q = useState(''), sel = useState(0), inp = useRef(null);
    useEffect(function () {
      function key(e) {
        var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
        if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) {
          e.preventDefault(); props.openSide(); setTimeout(function () { inp.current.focus(); inp.current.select(); }, 0); // #side is hidden until it has opened
        }
      }
      document.addEventListener('keydown', key);
      return function () { document.removeEventListener('keydown', key); };
    }, []);
    var v = q[0].trim(), hits = [], total = 0;
    if (v) {
      index = index || [].concat.apply([], pages.map(function (p) {
        return [{ p: p, ptr: '', text: '' }].concat(blocksOf(p).map(function (b) { return { p: p, ptr: b.p, text: textOf(b.h) }; }));
      }));
      var esc = function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
      var words = v.split(/\s+/).map(function (w) { return new RegExp(esc(w), 'i'); });
      index.forEach(function (t) {
        if (!words.every(function (w) { return w.test(t.p.title) || w.test(t.text); })) { return; }
        if (!t.ptr && !words.every(function (w) { return w.test(t.p.title); })) { return; } // a page by its title alone
        if (t.ptr && !words.some(function (w) { return w.test(t.text); })) { return; }
        var score = words.reduce(function (s, w) { return s + (w.test(t.p.title) ? 10 : 0); }, 0) + (t.ptr ? 0 : 5);
        var m = words[0].exec(t.text) || (words.length > 1 && words[1].exec(t.text)), i = m ? m.index : 0;
        var from = Math.max(0, i - 40), snp = t.text ? (from > 0 ? '… ' : '') + t.text.slice(from, i + 110) + (i + 110 < t.text.length ? ' …' : '') : '';
        hits.push({ p: t.p, ptr: t.ptr, score: score, snip: snp });
      });
      hits.sort(function (a, b) { return b.score - a.score; });
      total = hits.length;
      hits = hits.slice(0, LIMIT);
    }
    var re = v ? new RegExp('(' + v.split(/\s+/).map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'gi') : null;
    function go(h) {
      var to = blockHash(h.p.id, h.ptr);
      q[1](''); inp.current.blur();
      if (decode(location.hash) === decode(to)) { props.go(to); } else { location.hash = to; }
    }
    return html`<div class="search">
      <input type="search" id="q" ref=${inp} placeholder="Search  ( / )" aria-label="Search the documentation" autocomplete="off"
        role="combobox" aria-expanded=${v ? 'true' : 'false'} aria-controls="results"
        aria-activedescendant=${v && hits.length ? 'hit-' + sel[0] : undefined}
        value=${q[0]} onInput=${function (e) { q[1](e.target.value); sel[1](0); }}
        onKeyDown=${function (e) {
          if (e.key === 'ArrowDown' && hits.length) { e.preventDefault(); sel[1]((sel[0] + 1) % hits.length); }
          else if (e.key === 'ArrowUp' && hits.length) { e.preventDefault(); sel[1]((sel[0] + hits.length - 1) % hits.length); }
          else if (e.key === 'Enter' && hits[sel[0]]) { e.preventDefault(); go(hits[sel[0]]); }
          else if (e.key === 'Escape') { q[1](''); inp.current.blur(); }
        }} />
      ${v && html`<div id="results">
        <p class="count" role="status">${total ? 'Found: ' + total + (total > LIMIT ? ' · the first ones are shown, add a word' : '') : 'Nothing found'}</p>
        <ul role="listbox" aria-label="Search results">
        ${hits.map(function (h, k) {
          return html`<li id=${'hit-' + k} role="option" aria-selected=${k === sel[0] ? 'true' : 'false'} onClick=${function () { go(h); }}>
            <b>${h.p.title}</b>${h.snip && html`<span>${h.snip.split(re).map(function (part, n) { return n % 2 ? html`<mark>${part}</mark>` : part; })}</span>`}</li>`;
        })}
      </ul></div>`}
    </div>`;
  }

  // ---- "On this page" ----
  function Toc(props) {
    var on = useState(null);
    useEffect(function () {
      if (!window.IntersectionObserver || props.items.length < 2) { return; }
      var spy = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { on[1](e.target.id); } });
      }, { rootMargin: '0px 0px -75% 0px' });
      props.items.forEach(function (x) { var el = document.getElementById(x.id); if (el) { spy.observe(el); } });
      return function () { spy.disconnect(); };
    }, [props.items]);
    if (props.items.length < 2) { return null; }
    return html`<aside id="toc" aria-label="On this page"><h2>On this page</h2>
      ${props.items.map(function (x) { return html`<a href=${'#' + x.id} class=${'l' + x.level + (on[0] === x.id ? ' on' : '')}>${x.text}</a>`; })}
    </aside>`;
  }

  // ---- panels: comments, changes, export ----
  function Comments(props) {
    var list = props.comments, wait = unsent(list);
    var open = imported.filter(function (c) { return c.status !== 'done'; }).length;
    function send() {
      copy(exportText()).then(function () {
        markSent(); toast('Copied. Paste it into a message to the team.');
      }, function () { toast('Could not copy: download the file instead.'); });
    }
    function item(c, repo) {
      var p = byId[c.doc];
      return html`<div class="pc"><a href=${blockHash(c.doc, c.path)} onClick=${props.close}>${p ? p.title : c.doc}</a>
        <small class="ptr">${placeOf(p, c.path, c.quote)}</small><${Note} c=${c} repo=${repo} /></div>`;
    }
    return html`<section class="panel" aria-label="Comments">
      <div class="hh"><b>Your comments</b><button type="button" class="link" onClick=${props.close}>Close</button></div>
      ${list.length > 0 && html`<p class="muted">${wait ? 'Comments are kept only in this browser until you send them to the team.' : 'All comments are sent.'}</p>
      <div class="ed-row">
        <button type="button" class="pri" onClick=${send}>📋 Copy for sending</button>
        <button type="button" onClick=${function () { save('comments-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json', exportJSON()); markSent(); }}>Download as a file</button>
        <button type="button" onClick=${function () {
          if (confirm('Delete all comments of this browser?')) { setLocal([]); }
        }}>Delete all</button>
      </div>`}
      ${!list.length && html`<p class="muted">${touch ? 'No comments yet. Tap 💬 next to a paragraph to write one.' : 'No comments yet. Point at a paragraph and press 💬.'}</p>`}
      ${list.map(function (c) { return item(c, false); })}
      ${imported.length > 0 && html`<h3 class="rh">Received by the team: ${imported.length} · in work: ${open}</h3>
        ${imported.map(function (c) { return item(c, true); })}`}
    </section>`;
  }

  function Changes(props) {
    var since = props.since;
    var rows = pages.map(function (p) { return { p: p, d: pageDelta(p, since) }; })
      .filter(function (r) { return r.d.list.length || r.d.rm.length; });
    return html`<section class="panel" aria-label="Changes">
      <div class="hh"><b>Changes by page</b><button type="button" class="link" onClick=${props.close}>Close</button></div>
      <ul class="chg-list">${rows.map(function (r) {
        return html`<li><a href=${r.d.list.length ? blockHash(r.p.id, r.d.list[0]) : '#' + r.p.id} onClick=${props.close}>${r.p.title}</a>
          <small>${[r.d.chg && 'changed: ' + r.d.chg, r.d.add && 'new: ' + r.d.add, r.d.rm.length && 'removed: ' + r.d.rm.length].filter(Boolean).join(' · ')}</small></li>`;
      })}</ul>
    </section>`;
  }

  function Export(props) {
    var page = props.page;
    return html`<div class="panel menu">
      <button type="button" onClick=${function () { save(page.id + '.md', 'text/markdown', page.md); props.close(); }}>This page (.md)</button>
      <button type="button" onClick=${function () { save('docs.md', 'text/markdown', D.single); props.close(); }}>All pages in one file (.md)</button>
      <button type="button" onClick=${function () { save('docs.zip', 'application/zip', unzip64(D.zip)); props.close(); }}>All pages as separate files (.zip)</button>
    </div>`;
  }

  function Toolbar(props) {
    var real = [];
    commits.forEach(function (c, k) { if (c.h) { real.push(k); } });
    var ch = props.changes, last = commits.length - 1;
    function label(k) { return k === 0 && H.base ? 'the version sent on ' + date(0) : versionLine(k); }
    var ver = html`${last >= 0 && commits[last].h && html`<small class="ver-l">Version of ${date(last)}</small>`}
      <button type="button" class=${props.panel === 'e' ? 'on' : ''} onClick=${function () { props.setPanel(props.panel === 'e' ? null : 'e'); }}>⬇ Export</button>`;
    return html`<div class="toolbar"><div class="tb-row">
      ${real.length > 0 && html`<label class="since-l">Show changes since
        <select value=${props.since == null ? '' : String(props.since)} onChange=${function (e) {
          props.setSince(e.target.value === '' ? null : +e.target.value);
        }}>
          <option value="">do not show</option>
          ${real.slice().reverse().map(function (k) { return html`<option value=${String(k)}>${label(k)}</option>`; })}
        </select></label>`}
      <span class="sp"></span>
      ${!ch && ver}
      <button type="button" class=${props.panel === 'c' ? 'on' : ''} onClick=${function () { props.setPanel(props.panel === 'c' ? null : 'c'); }}>💬 Comments${props.comments.length ? ' ' + props.comments.length : ''}${unsent(props.comments) ? html` <span class="badge warn">${unsent(props.comments)} not sent</span>` : ''}</button>
      </div>
      ${ch && html`<div class="tb-row"><span class="chg-nav">
        <button type="button" class=${props.panel === 'd' ? 'on' : ''} onClick=${function () { props.setPanel(props.panel === 'd' ? null : 'd'); }}>
          ${ch.list.length ? 'Changed paragraphs: ' + ch.list.length + ' · pages: ' + ch.pages : (ch.rm ? 'Only removals' : 'No changes')}</button>
        ${ch.list.length > 0 && html`<button type="button" aria-label="Previous change" onClick=${function () { props.step(-1); }}>←</button>
          <span class="pos">${props.at >= 0 ? (props.at + 1) + ' of ' + ch.list.length : ''}</span>
          <button type="button" aria-label="Next change" onClick=${function () { props.step(1); }}>→</button>`}
      </span><span class="sp"></span>${ver}</div>`}
    </div>`;
  }

  // ---- application ----
  function App() {
    var r = useState(route(location.hash)), side = useState(false), toc = useState([]);
    var sinceHash = useState(store('since')), panel = useState(null), at = useState(-1);
    var comments = useComments();
    var page = r[0].page;
    // the chosen version is kept by hash: indexes change with every commit;
    // the file's own starting point is the default, "off" turns it off
    var since = null;
    commits.forEach(function (c, k) { if (c.h && c.h === sinceHash[0]) { since = k; } });
    if (since == null && sinceHash[0] !== 'off' && H.base && commits.length) { since = 0; }
    var changes = since != null ? allChanges(since) : null;
    useEffect(function () {
      function on() { r[1](route(location.hash)); side[1](false); }
      window.addEventListener('hashchange', on);
      // the place of reading goes into the history entry, so Back returns to it
      var t;
      function onScroll() {
        clearTimeout(t);
        t = setTimeout(function () { try { history.replaceState({ y: window.scrollY }, ''); } catch (e) { /* not allowed */ } }, 150);
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      return function () { window.removeEventListener('hashchange', on); window.removeEventListener('scroll', onScroll); };
    }, []);
    useEffect(function () {
      function key(e) { if (e.key === 'Escape' && side[0]) { side[1](false); document.getElementById('menu').focus(); } }
      document.addEventListener('keydown', key);
      return function () { document.removeEventListener('keydown', key); };
    }, [side[0]]);
    useEffect(function () {
      document.title = page === pages[0] ? D.title : page.title + ' · ' + D.title;
      var st = history.state, t = r[0].target && document.getElementById(r[0].target);
      var b = r[0].block && document.querySelector('[data-p="' + CSS.escape(r[0].block) + '"]');
      if (st && st.y != null && !r[0].block) { window.scrollTo({ top: st.y, behavior: 'instant' }); }
      else if (b) {
        b.scrollIntoView({ block: 'center', behavior: 'instant' }); b.classList.add('flash');
        setTimeout(function () { b.classList.remove('flash'); }, 1600);
        if (changes) { changes.list.forEach(function (x, k) { if (x.page === page && x.ptr === r[0].block) { at[1](k); } }); }
      } else if (t) { t.scrollIntoView({ behavior: 'instant' }); } else { window.scrollTo({ top: 0, behavior: 'instant' }); }
      var cur = document.querySelector('#tree [aria-current]'), sd = document.getElementById('side');
      if (cur && sd) {
        var a = cur.getBoundingClientRect(), s = sd.getBoundingClientRect();
        if (a.top < s.top + 60 || a.bottom > s.bottom - 20) { sd.scrollTop += a.top - s.top - 120; }
      }
    }, [r[0]]);
    function setSince(v) { var h = v == null ? 'off' : commits[v].h; sinceHash[1](h); store('since', h); at[1](-1); }
    function setToc(items) { if (JSON.stringify(items) !== JSON.stringify(toc[0])) { toc[1](items); } }
    function step(d) {
      var n = changes.list.length, k = at[0] < 0 ? (d > 0 ? 0 : n - 1) : (at[0] + d + n) % n, x = changes.list[k];
      at[1](k);
      var h = blockHash(x.page.id, x.ptr);
      if (decode(location.hash) === decode(h)) { r[1](route(h)); } else { location.hash = h; }
    }
    function closeSide() { side[1](false); }
    return html`
      <a class="skip" href="#main" onClick=${function (e) { e.preventDefault(); var m = document.getElementById('main'); m.focus(); m.scrollIntoView(); }}>Skip to content</a>
      <header class="bar">
        <button id="menu" type="button" aria-label="Menu" aria-expanded=${side[0] ? 'true' : 'false'} aria-controls="side" onClick=${function () { side[1](!side[0]); }}>☰</button>
        ${D.brand.head && html`<span dangerouslySetInnerHTML=${{ __html: D.brand.head }}></span>`}
      </header>
      <div class="shell">
        ${side[0] && html`<div class="scrim" onClick=${closeSide}></div>`}
        <aside id="side" class=${side[0] ? 'open' : ''} aria-label="Navigation">
          <button type="button" class="side-x" onClick=${closeSide}>✕ Close</button>
          ${D.brand.head && html`<div class="side-brand" dangerouslySetInnerHTML=${{ __html: D.brand.head }}></div>`}
          <${Search} openSide=${function () { side[1](true); }} go=${function (h) { r[1](route(h)); }} />
          ${D.full && html`<p class="banner">Full build: includes hidden documents and notes. Do not publish.</p>`}
          <nav id="tree" aria-label="Document tree">
            ${tree.length > 0 && html`<h2>Pages</h2><${Items} nodes=${tree} cur=${page.id} since=${since} />`}
            ${orphans.length > 0 && html`<${Group} label="Without parent" n=${D.nav.orphans.length}><${Items} nodes=${orphans} cur=${page.id} since=${since} /><//>`}
            ${D.nav.uncovered && html`<${Group} label="Documents without code coverage" n=${D.nav.uncovered.length}>
              <ul>${D.nav.uncovered.map(function (id) { return html`<li><a href=${'#' + id}>${byId[id] ? byId[id].title : id}</a></li>`; })}</ul><//>`}
          </nav>
        </aside>
        <main id="main" tabindex="-1">
          <${Toolbar} since=${since} setSince=${setSince} panel=${panel[0]} setPanel=${panel[1]} comments=${comments}
            changes=${changes} at=${at[0]} step=${step} />
          ${panel[0] === 'c' && html`<${Comments} comments=${comments} close=${function () { panel[1](null); }} />`}
          ${panel[0] === 'd' && changes && html`<${Changes} since=${since} close=${function () { panel[1](null); }} />`}
          ${panel[0] === 'e' && html`<${Export} page=${page} close=${function () { panel[1](null); }} />`}
          <${Page} key=${page.id} page=${page} comments=${comments} since=${since} onToc=${setToc} missing=${r[0].missing} />
        </main>
        <${Toc} items=${toc[0]} />
      </div>
      <${Toast} />`;
  }

  render(html`<${App} />`, document.getElementById('app'));
})();

</script>
