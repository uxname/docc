<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index</title>
<style>
:root{color-scheme:light dark;
--bg:#fff;--bg2:#f6f7f9;--fg:#1c2128;--muted:#5d6875;--line:#e2e5ea;--field:#8a94a0;--accent:#2f5fd0;--accent-bg:#eaf0fd;--on-accent:#fff;--code:#f1f3f6;
--chg:#0969da;--new:#1a7f37;--rem:#cf222e;--ins-fg:#0f5a2c;--ins-bg:#dcf3e3;--del-fg:#8f1d1d;--del-bg:#fbe2e2;--frag-bg:#fff3bf;--frag-line:#9a6700;
--warn:#8a4b00;--warn-bg:#fdf1d8;--ok:#1a7f45;--ok-bg:#e3f5ea;--bad:#b42323;--bad-bg:#fbe7e7;--shadow:0 6px 24px rgba(20,30,50,.12);
--hbg:var(--bg2);--hfg:var(--fg);--hline:var(--line);--top:56px;--side:304px;--rail:280px;--col:720px;--tgt:32px}
@media (prefers-color-scheme:dark){:root{
--bg:#0f1318;--bg2:#161b22;--fg:#e4e8ee;--muted:#9aa5b1;--line:#2b323b;--field:#6b7684;--accent:#6c9bff;--accent-bg:#1a2742;--on-accent:#0f1318;--code:#1b2129;
--chg:#4493f8;--new:#3fb950;--rem:#f85149;--ins-fg:#9be9b4;--ins-bg:#12301f;--del-fg:#ffb3b3;--del-bg:#3d1a1a;--frag-bg:#4a3c00;--frag-line:#d4a72c;
--warn:#e5a93b;--warn-bg:#3a2d0f;--ok:#4cc17f;--ok-bg:#12301f;--bad:#f07a7a;--bad-bg:#3a1717;--shadow:0 6px 24px rgba(0,0,0,.5)}}
@media (pointer:coarse),(max-width:820px){:root{--tgt:44px}}
@media (max-width:820px){:root{--top:48px}}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--top) + 16px)}
html.w-mode{scroll-padding-bottom:88px}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
@media (max-width:820px){body{font-size:16px}}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:.15em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:3px}
[tabindex="-1"]:focus{outline:0}
.shell.work .blk.cur>.blk-body,.shell.work .ghost.cur{outline:2px solid var(--accent);outline-offset:6px;border-radius:2px}
.skip{position:absolute;left:-999px}
.skip:focus{left:1rem;top:1rem;z-index:60;background:var(--bg);padding:.5rem 1rem;box-shadow:var(--shadow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted);font-size:.875rem}
.sp{flex:1}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.noscript{padding:2rem}
/* buttons and chips */
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:var(--tgt);padding:0 .8rem;font-size:.875rem;line-height:1.2;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.ico{min-width:var(--tgt);padding:0 .5rem;font-size:1.05rem}
.btn.sm{min-height:28px;padding:0 .55rem;font-size:.8rem}
@media (pointer:coarse){.btn.sm{min-height:44px;padding:0 .8rem;font-size:.875rem}}
.btn:disabled{opacity:.45;cursor:default}
button.link{padding:0;border:0;background:none;color:var(--accent);font-size:.8125rem;min-height:24px}
.chip{display:inline-flex;align-items:center;padding:.05rem .55rem;font-size:.75rem;line-height:1.6;border-radius:99px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);white-space:nowrap}
.chip.kind{background:var(--bg2);border-color:var(--line);color:var(--accent);font-weight:600}
.chip.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.chip.tag{border-style:dashed}
button.chip{min-height:var(--tgt);font-size:.8125rem;font-weight:600;padding:0 .7rem}
/* header */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.6rem;height:var(--top);padding:0 1rem;background:var(--hbg);color:var(--hfg);border-bottom:1px solid var(--hline)}
.proj{display:flex;align-items:center;gap:.6rem;min-width:0;color:inherit;text-decoration:none;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .btn{background:transparent;color:inherit;border-color:var(--hline)}
.mode{display:inline-flex;margin:0 0 0 .5rem;padding:3px;border:1px solid var(--hline);border-radius:8px;background:var(--bg)}
.mode label{display:inline-flex;align-items:center;min-height:calc(var(--tgt) - 6px);padding:0 .85rem;font-size:.875rem;font-weight:600;color:var(--muted);border-radius:6px;cursor:pointer;white-space:nowrap}
.mode label.on{background:var(--accent);color:var(--on-accent)}
.mode label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.mode input{position:absolute;opacity:0;width:1px;height:1px}
.mc{font-weight:500}
.more-b{position:relative}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.pop{margin:0;inset:auto;position:fixed;top:calc(var(--top) + 4px);right:12px;left:auto;min-width:17rem;padding:.35rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.pop hr{border:0;border-top:1px solid var(--line);margin:.3rem 0}
.mi{display:block;width:100%;min-height:var(--tgt);padding:.35rem .7rem;text-align:left;font-size:.875rem;background:none;border:0;border-radius:6px}
.mi:hover,.mi:focus-visible{background:var(--accent-bg)}
.mi.bad{color:var(--bad)}
.mi.phone{display:none}
.hint{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .8rem;margin:0;padding:.45rem 1rem;font-size:.875rem;background:var(--accent-bg);border-bottom:1px solid var(--line)}
/* layout */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - var(--top))}
@media (max-width:1279px){.shell{display:block}}
#side{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:clip;background:var(--bg2);border-right:1px solid var(--line);font-size:.875rem;line-height:1.45}
main{min-width:0;padding:2rem 1.5rem 6rem;outline:0}
.page{max-width:var(--col);margin:0 auto}
.shell.work .page{max-width:var(--col)}
@media (min-width:1024px){.shell.work .page{max-width:calc(var(--col) + 32px + var(--rail))}}
@media (max-width:820px){main{padding:1.25rem 1rem 6rem}}
.drawer{margin:0;padding:0;overflow:clip;width:min(88vw,352px);max-width:none;height:100%;max-height:none;border:0;border-right:1px solid var(--line);background:var(--bg2);color:var(--fg);font-size:.875rem;line-height:1.45}
.drawer::backdrop{background:rgba(0,0,0,.4)}
.drawer[open]{animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(-100%)}}
.side-x{margin:.75rem .75rem 0 auto;display:flex}
.side-in{display:flex;flex-direction:column;height:100%}
.drawer[open]{display:flex;flex-direction:column}
.drawer .side-in{flex:1;min-height:0}
.side-top{padding:1rem .9rem .6rem}
.side-brand{display:none}
@media (max-width:820px){.side-brand{display:block;margin-bottom:.8rem}}
.banner{margin:.7rem 0 0;padding:.5rem .7rem;font-size:.8125rem;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.tabs{display:flex;gap:2px;margin:0 .6rem;border-bottom:1px solid var(--line)}
.tabs [role=tab]{flex:auto;min-width:0;min-height:var(--tgt);padding:.2rem .1rem;font-size:.78rem;font-weight:600;line-height:1.2;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs [role=tab][aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.panel{flex:1;min-height:0;overflow:hidden auto;padding:.5rem .5rem 2rem}
.pad{padding:.4rem .4rem}
/* search */
.search{position:relative}
#q{width:100%;min-height:var(--tgt);padding:.35rem .75rem;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--field);border-radius:6px}
#q:focus{border-color:var(--accent)}
#results{position:absolute;left:0;right:0;top:calc(100% + .35rem);z-index:20;margin:0;padding:.3rem;max-height:70vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
#results ul{margin:0;padding:0;list-style:none}
#results .count{margin:.2rem .6rem .3rem;color:var(--muted);font-size:.8rem}
#results li{padding:.5rem .6rem;border-radius:6px;cursor:pointer}
#results li[aria-selected=true],#results li:hover{background:var(--accent-bg)}
#results b{display:block;font-weight:600}
#results span{display:block;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
#results mark{background:var(--warn-bg);color:inherit;border-radius:2px}
/* tree */
#tree ul{margin:0;padding:0;list-style:none}
#tree ul ul{margin-left:.6rem;padding-left:.5rem;border-left:1px solid var(--line)}
#tree li{position:relative}
#tree a{display:flex;align-items:center;gap:.4rem;min-height:var(--tgt);padding:.2rem .5rem .2rem 1.6rem;border-radius:6px;color:var(--fg);text-decoration:none}
#tree a>span:first-child{flex:1;min-width:0}
#tree a:hover{background:var(--accent-bg)}
#tree a[aria-current=page]{background:var(--accent-bg);font-weight:700}
#tree .toc{border-left:0;margin:.1rem 0 .3rem 1.6rem;padding:0}
#tree .toc a{min-height:28px;padding:.15rem .5rem;font-size:.8125rem;color:var(--muted);border-left:2px solid var(--line);border-radius:0}
#tree .toc a.l3{padding-left:1.2rem}
#tree .toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:600}
.cnt{font-size:.75rem;font-weight:600;color:var(--chg)}
.tw{position:absolute;left:0;top:calc((var(--tgt) - 1.5rem) / 2);width:1.5rem;height:1.5rem;padding:0;border:0;background:none;color:var(--muted);border-radius:4px}
@media (pointer:coarse){.tw{width:44px;height:44px;top:0;left:-.6rem}}
.tw::before{content:"▾";display:block;transition:transform .12s}
.tw[aria-expanded=false]::before{transform:rotate(-90deg)}
.gh{margin:1rem 0 .3rem;font-size:.75rem}
.gt{display:flex;width:100%;gap:.4rem;align-items:center;min-height:var(--tgt);padding:0 .5rem;font:inherit;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:none;border:0;text-align:left}
.gt span{margin-left:auto;padding:0 .45rem;font-weight:400;background:var(--line);border-radius:99px}
.more{display:block;width:100%;min-height:var(--tgt);margin-top:.3rem;padding:.3rem;font:inherit;font-size:.8125rem;color:var(--accent);background:none;border:1px dashed var(--line);border-radius:6px}
/* edits and comments tabs */
.left{margin:.2rem 0 .3rem;font-weight:600}
progress{display:block;width:100%;height:6px;margin-bottom:.8rem;accent-color:var(--chg)}
.eg{display:flex;justify-content:space-between;margin:.9rem .2rem .2rem;font-size:.8125rem;font-weight:700}
.eg span{color:var(--muted);font-weight:500}
.edits,.clist{margin:0;padding:0;list-style:none}
.er,.cr{display:flex;gap:.5rem;width:100%;min-height:var(--tgt);padding:.35rem .5rem;text-align:left;font-size:.8125rem;line-height:1.4;background:none;border:0;border-radius:6px}
.er:hover,.cr:hover,.er.on{background:var(--accent-bg)}
.g{flex:none;width:1rem;font-weight:700;text-align:center}
.g.chg{color:var(--chg)}.g.new{color:var(--new)}.g.rm{color:var(--rem)}
.again{display:block;color:var(--warn);font-size:.75rem}
.cr{flex-direction:column;align-items:flex-start;gap:.15rem;border-bottom:1px solid var(--line);border-radius:0}
.cp{color:var(--muted);font-size:.75rem}
.ctx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.send{margin:.2rem 0 .8rem;padding:.7rem;background:var(--warn-bg);border-radius:8px}
.send p{margin:0 0 .5rem}
/* page */
.crumbs{display:flex;flex-wrap:wrap;gap:.4rem;font-size:.8125rem;color:var(--muted);margin-bottom:.5rem}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent);text-decoration:underline}
h1{margin:0 0 1.2rem;font-size:30px;line-height:1.25;letter-spacing:-.015em;font-weight:700}
@media (max-width:820px){h1{font-size:26px}}
.badges{display:flex;flex-wrap:wrap;gap:.4rem;margin:-.6rem 0 1.4rem}
.shell.work .page>:not(.doc),.shell.work .ghost{max-width:var(--col)}
.doc{overflow-wrap:break-word}
.blk-body p,.blk-body ul,.blk-body ol,.blk-body table,.blk-body pre,.blk-body blockquote{margin:0 0 1rem}
.blk-body h2{position:relative;margin:2.5rem 0 .8rem;font-size:22px;line-height:1.3;font-weight:650;letter-spacing:-.01em}
.blk-body h3{position:relative;margin:1.8rem 0 .6rem;font-size:18px;line-height:1.35;font-weight:650}
.blk-body h4{position:relative;margin:1.4rem 0 .5rem;font-size:1rem}
.anchor{position:absolute;left:-1.2rem;color:var(--muted);text-decoration:none;opacity:0}
:is(h2,h3,h4):hover>.anchor,.anchor:focus{opacity:1}
@media (max-width:820px){.anchor{display:none}}
.blk-body li{margin:.25rem 0}
.blk-body ul,.blk-body ol{padding-left:1.5rem}
.blk-body li>ul,.blk-body li>ol{margin:.25rem 0}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
code{padding:.1em .35em;background:var(--code);border-radius:4px}
pre{position:relative;padding:.9rem 1rem;overflow-x:auto;background:var(--code);border:1px solid var(--line);border-radius:8px;line-height:1.55}
pre code{padding:0;background:none}
.copy{position:absolute;top:.4rem;right:.4rem;padding:.15rem .55rem;font:inherit;font-size:.75rem;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:6px;opacity:0}
pre:hover .copy,pre:focus-within .copy,.copy:focus{opacity:1}
@media (pointer:coarse){.copy{opacity:1;min-height:44px}}
table{display:block;max-width:100%;overflow-x:auto;outline-offset:2px;border-collapse:collapse;font-size:15px}
th{background:var(--bg2);font-weight:600}
th,td{padding:.5rem .8rem;border:1px solid var(--line);text-align:left;vertical-align:top}
blockquote{padding:.6rem 1rem;border-left:4px solid var(--line);background:var(--bg2);border-radius:0 8px 8px 0}
blockquote p{margin:0}
.props{margin:0 0 1.6rem;padding:.5rem 1rem;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.prop{display:grid;grid-template-columns:minmax(7rem,12rem) minmax(0,1fr);gap:1rem;padding:.35rem 0}
.prop p{margin:0}
.pk{color:var(--muted);font-size:.875rem;padding-top:.1rem}
@media (max-width:600px){.prop{grid-template-columns:1fr;gap:0}}
.rh{margin:3rem 0 .8rem;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rows{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:block;padding:.8rem 1rem;color:inherit;text-decoration:none;border-top:1px solid var(--line)}
.rows .row:first-child{border-top:0}
.rows .row:hover{background:var(--accent-bg)}
.ct{font-weight:600;color:var(--accent)}
.cs{display:block;margin-top:.2rem;font-size:.9rem;line-height:1.5;color:var(--muted)}
.related{display:grid;gap:.6rem}
.rg{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem .5rem}
.rl{min-width:7.5rem;font-size:.875rem;color:var(--muted)}
.pchip{display:inline-block;padding:.1rem .7rem;font-size:.875rem;text-decoration:none;color:var(--accent);background:var(--accent-bg);border-radius:99px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:3rem}
.pn a{display:flex;flex-direction:column;gap:.1rem;padding:.8rem 1rem;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:8px}
.pn a:hover{border-color:var(--accent)}
.pn small{color:var(--muted)}
.pn span{color:var(--accent);font-weight:600}
.pn .next{grid-column:2;text-align:right}
@media (max-width:820px){.pn{grid-template-columns:1fr}.pn .next{grid-column:1}}
.notice{margin:0 0 1.2rem;padding:.6rem .9rem;background:var(--warn-bg);border-radius:8px}
.overview{margin:0 0 1.8rem;padding:1rem 1.2rem;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.overview h2{margin:0 0 .3rem;font-size:18px}
.overview p{margin:0 0 .5rem;color:var(--muted)}
.overview ul{margin:0 0 .9rem;padding-left:1.2rem}
/* blocks in the Work mode: the text, and beside it (under it when narrow) the tools and comment cards */
.blk{position:relative;border-radius:4px;margin-bottom:1rem}
.blk-body>:last-child{margin-bottom:0}
.blk.flash>.blk-body,.ghost.flash{background:var(--accent-bg);transition:background .6s}
@media (min-width:1024px){
.shell.work .blk{display:grid;grid-template-columns:minmax(0,var(--col)) var(--rail);column-gap:32px;align-items:start}
.shell.work .blk>.old,.shell.work .blk>.blk-body{grid-column:1}
.shell.work .blk-side{grid-column:2;grid-row:1 / span 2;height:0;overflow:visible;position:relative;z-index:2}
.shell.work .doc{padding-bottom:4rem}
}
.blk-side{display:flex;flex-direction:column;gap:8px;font-size:.875rem;line-height:1.5}
.blk-side:empty{display:none}
.tools{display:none;gap:.3rem;flex-wrap:wrap}
.blk.cur>.blk-side>.tools{display:flex}
@media (pointer:fine) and (min-width:1024px){.shell.work .blk[data-a]>.blk-side>.tools{display:flex;visibility:hidden}
.blk:hover>.blk-side>.tools,.blk:focus-within>.blk-side>.tools,.blk.cur>.blk-side>.tools{visibility:visible!important}}
@media (max-width:1023px){.blk-side:has(>*:not(.tools)),.blk.cur>.blk-side{margin:.2rem 0 1rem}}
/* gutter: a bar left of the text */
.blk.chg>.blk-body,.blk.new>.blk-body{position:relative}
.blk.chg>.blk-body::before,.blk.new>.blk-body::before{content:"";position:absolute;left:-14px;top:2px;bottom:2px;width:4px;border-radius:2px;background:var(--chg)}
.blk.new>.blk-body::before{background:var(--new)}
.blk.new>.blk-body::after{content:"+";position:absolute;left:-30px;top:-2px;font:700 13px/1 system-ui,sans-serif;color:var(--new)}
.blk.seen>.blk-body::before{background:var(--field)}
.blk.seen>.blk-body::after{content:"✓";color:var(--muted)}
@media (max-width:820px){.blk.chg>.blk-body::before,.blk.new>.blk-body::before{left:-10px;width:3px}.blk.new>.blk-body::after{display:none}
.blk.new:not(.seen)>.blk-body::before{background:repeating-linear-gradient(var(--new) 0 6px,transparent 6px 9px)}}
.blk-body ins,.dv ins,.legend ins{color:var(--ins-fg);background:var(--ins-bg);text-decoration:underline 2px;text-underline-offset:3px;border-radius:2px}
.blk-body del,.dv del,.legend del{color:var(--del-fg);background:var(--del-bg);text-decoration:line-through;border-radius:2px}
.dv{white-space:pre-wrap;overflow-wrap:anywhere}
.dv.whole del,.dv.whole ins{display:block;padding:.2rem .4rem}
.dv.whole del{margin-bottom:.3rem}
.old{margin:0 0 .4rem;font-size:.875rem}
.old summary{cursor:pointer;color:var(--muted);min-height:var(--tgt);display:flex;align-items:center}
.old .dv{padding:.5rem .75rem;background:var(--del-bg);border-radius:6px}
.old .dv del{background:none}
/* removed paragraph, in its old place */
.ghost{position:relative;margin:0 0 1rem;font-size:.875rem;color:var(--muted)}
.ghost::before{content:"";position:absolute;left:-14px;top:2px;bottom:2px;border-left:4px dashed var(--rem)}
.ghost.seen::before{border-left-width:2px}
.ghost summary{display:flex;align-items:center;min-height:var(--tgt);cursor:pointer;list-style:none}
.ghost summary::before{content:"−";width:1rem;margin-right:.3rem;color:var(--rem);font-weight:700}
.ghost.seen summary::before{content:"✓";color:var(--muted)}
.ghost .dv{padding:.5rem .75rem;background:var(--del-bg);border-radius:6px}
.ghost .dv del{background:none}
@media (max-width:820px){.ghost::before{left:-10px;border-left-width:3px}}
/* comment cards */
.card{padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;outline:0}
.card.on,.card:focus{border:2px solid var(--accent);padding:9px 11px}
.card .nt{white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card.on .nt,.card:focus .nt{display:block}
.fq{margin:0 0 .3rem;padding-left:.5rem;border-left:2px solid var(--frag-line);font-style:italic;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
blockquote.fq{white-space:normal;background:none;border-radius:0}
.meta{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;margin-top:.35rem;font-size:.8125rem}
.meta small{color:var(--muted)}
.acts{display:flex;gap:.7rem;margin-left:auto}
.reply{margin-top:.4rem;padding-top:.4rem;border-top:1px dashed var(--line)}
.reply small{display:block;color:var(--muted)}
mark.frag{background:var(--frag-bg);color:inherit;border-bottom:2px dotted var(--frag-line);border-radius:2px}
.editor{padding:.7rem;background:var(--bg);border:1px solid var(--accent);border-radius:8px}
.who-l{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;color:var(--muted);font-size:.875rem}
.editor .who{flex:1;min-width:0;min-height:var(--tgt);padding:.2rem .5rem}
.editor textarea{display:block;width:100%;min-height:5rem;margin-bottom:.5rem;padding:.5rem .6rem;resize:vertical}
.editor textarea,.editor .who{font:inherit;font-size:1rem;color:var(--fg);background:var(--bg);border:1px solid var(--field);border-radius:6px}
.mic-w{display:flex;align-items:center;gap:.5rem}
.mic{user-select:none;touch-action:none}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
.err{color:var(--bad)}
/* the edits navigator, the map of edits, the fragment button */
.nav{position:fixed;z-index:25;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:.4rem;padding:4px 6px;background:var(--bg2);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);font-size:.875rem;max-width:calc(100vw - 24px)}
.nav .btn{border-radius:18px}
.nav .pos{padding:0 .3rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.nav .rest{color:var(--muted)}
.npg{display:inline-block;max-width:14rem;margin-left:.4rem;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;color:var(--muted);font-size:.8125rem}
@media (max-width:820px){.npg{display:none}}
.seen-l{display:inline-flex;align-items:center;gap:.35rem;min-height:var(--tgt);padding:0 .6rem;border-left:1px solid var(--line);cursor:pointer;white-space:nowrap}
.seen-l input{width:18px;height:18px;margin:0;accent-color:var(--chg)}
@media (max-width:820px){
.nav{left:0;right:0;bottom:0;transform:none;max-width:none;justify-content:space-between;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-radius:0;border-width:1px 0 0;background:var(--bg)}
.nav .pos{flex:1;text-align:center;white-space:normal;line-height:1.25}
.nav>.btn.pri{flex:1}
}
@media (max-width:420px){.nav .rest{display:none}}
@media (pointer:coarse){body:has(textarea:focus) .nav{display:none}}
.cmap{position:fixed;z-index:20;right:0;top:var(--top);bottom:72px;width:10px;background:var(--bg2);border-left:1px solid var(--line)}
.tk{position:absolute;left:1px;right:1px;height:3px;background:var(--chg);cursor:pointer}
.tk.new{background:var(--new)}.tk.rm{background:var(--rem)}
.tk.seen{background:var(--field)}
.tk.on{height:6px}
@media (max-width:1023px),(pointer:coarse){.cmap{display:none}}
.fragb{position:fixed;z-index:35;min-height:32px;box-shadow:var(--shadow)}
/* dialogs */
.dlg{width:min(36rem,calc(100vw - 2rem));max-height:calc(100vh - 4rem);padding:0;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.dlg.wide{width:min(52rem,calc(100vw - 2rem))}
.dlg::backdrop{background:rgba(0,0,0,.4)}
.dlg-h{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem 1rem;background:var(--bg);border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-size:1.05rem}
.dlg-b{padding:.5rem 1rem 1rem;font-size:.9375rem}
.dlg-b h3{margin:1rem 0 .4rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.5rem;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:.5rem}
.lb{display:inline-block;width:4px;height:1.2rem;border-radius:2px;background:var(--chg)}
.lb.new{background:var(--new)}.lb.rm{background:none;border-left:4px dashed var(--rem)}
.lb.seen{background:var(--field)}
.keys{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1rem;margin:0}
.keys dd{margin:0}
kbd{padding:.05rem .4rem;font:13px ui-monospace,monospace;background:var(--bg2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px}
.since-l{display:flex;flex-direction:column;gap:.4rem}
.since-l select{min-height:var(--tgt);padding:.2rem .4rem;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--field);border-radius:6px}
.ver{padding:.5rem 0;border-top:1px solid var(--line)}
.vh{color:var(--muted);font-size:.8125rem;margin-bottom:.25rem}
.pg-g{margin:.3rem 0}
.pg-g>small{color:var(--muted);text-transform:uppercase;font-size:.7rem;letter-spacing:.06em}
.pg-i{margin:.2rem 0 .4rem}
.ptr{display:block;color:var(--muted);font-size:.8rem}
/* toasts sit under the header, away from the current edit in the middle and the navigator below */
.toast-w{position:fixed;left:50%;top:calc(var(--top) + 12px);z-index:50;transform:translateX(-50%);max-width:calc(100vw - 2rem)}
.toast{display:flex;gap:1rem;align-items:baseline;padding:.6rem 1rem;background:var(--fg);color:var(--bg);border-radius:8px;box-shadow:var(--shadow);font-size:.9rem}
.toast .link{color:var(--bg);text-decoration:underline;font-size:inherit}
/* narrow screens: the header keeps the menu, the mode and «⋯» */
@media (max-width:1279px){.top .proj{max-width:16rem}}
@media (max-width:820px){
.top{gap:.4rem;padding:0 .5rem}
.top .proj,.top .mid,.top .unsent{display:none}
.mode{margin:0 auto}
.mode label{padding:0 .7rem}
.mi.phone{display:block}
.pop{left:8px;right:8px;top:auto;bottom:8px;min-width:0}
}
@media (prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}
@media (forced-colors:active){
.blk.chg>.blk-body::before{background:CanvasText}
.blk.new>.blk-body::before{background:none;border-left:4px double CanvasText}
.ghost::before{border-color:CanvasText}
}
@media print{
.top,.hint,#side,.drawer,.nav,.cmap,.fragb,.tools,.overview,.skip,.copy,.pn,.toast-w,.notice,.pop,.editor,.dlg{display:none!important}
.shell{display:block}
main{padding:0}
.page,.shell.work .page{max-width:none}
.shell.work .blk{display:block}
.blk-side{height:auto!important;transform:none!important}
.blk.chg>.blk-body::before,.blk.new>.blk-body::before{display:none}
.blk.chg>.blk-body,.blk.new>.blk-body{border-left:4px solid #888;padding-left:8px}
.card{break-inside:avoid;margin:.3rem 0 .8rem}
a{color:inherit;text-decoration:none}
}
.proj a{color:inherit;text-decoration:none;overflow:hidden;text-overflow:ellipsis}
.tc{display:inline-block;margin-left:.1rem;padding:0 .3rem;font-size:.6875rem;font-weight:600;line-height:1.5;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:99px}

<script>
// The documentation application: one page at a time drawn from the JSON
// island #docc-data with Preact and htm (vendor/htm-preact-standalone.js).
// Labels are marked as t:English in double braces and translated by the build (lang.go).
// Two modes: Reading shows the final text only; Work adds the edits since the
// starting point (word diff in the text, gutter bars, removed paragraphs in
// place, a navigator), comments on the margin and the tools.
(function () {
  'use strict';
  var P = window.htmPreact;
  var html = P.html, render = P.render;
  var useState = P.useState, useEffect = P.useEffect, useRef = P.useRef;
  var D = JSON.parse(document.getElementById('docc-data').textContent);
  var pages = D.pages, byId = {};
  pages.forEach(function (p, i) { p.i = i; byId[p.id] = p; });
  var H = D.hist || { commits: [], docs: {} };
  var commits = H.commits || [];
  var mq = function (q) { return !!(window.matchMedia && matchMedia(q).matches); };
  var coarse = mq('(pointer: coarse)');
  var reduced = mq('(prefers-reduced-motion: reduce)');

  // ---- small helpers ----
  function store(k, v) {
    try {
      if (v === undefined) { return JSON.parse(localStorage.getItem(D.key + ':' + k)); }
      localStorage.setItem(D.key + ':' + k, JSON.stringify(v));
    } catch (e) { return null; }
  }
  function decode(h) {
    h = h.replace(/^#/, '');
    try { return decodeURIComponent(h); } catch (e) { return h; }
  }
  // the page a hash belongs to: a page id, <page id>--<anchor> (a heading or
  // field) or <page id>/<JSON Pointer> (a paragraph)
  function route(hash) {
    var id = decode(hash);
    if (byId[id]) { return { page: byId[id] }; }
    var best = null;
    pages.forEach(function (p) {
      if (id.indexOf(p.id + '--') === 0 && (!best || p.id.length > best.id.length)) { best = p; }
    });
    if (best) { return { page: best, target: id }; }
    var k = id.indexOf('/');
    if (k > 0 && byId[id.slice(0, k)]) { return { page: byId[id.slice(0, k)], block: id.slice(k) }; }
    return { page: pages[0], missing: id && id !== 'main' ? id : null };
  }
  function blockHash(doc, ptr) { return '#' + doc + (ptr || ''); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function date(c) {
    var cm = commits[c];
    if (!cm || !cm.d) { return ''; }
    var d = new Date(cm.d);
    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear();
  }
  function when(c) {
    var cm = commits[c];

  }

  function versionLine(c) {
    var cm = commits[c] || {};
    if (!cm.h) { return 'not saved yet'; }
    return when(c) + (cm.a ? ' · ' + cm.a : '') + (cm.m ? ' · ' + cm.m : '');
  }
  function save(name, type, data) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: type }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function copy(text) {
    function old() {
      var t = document.createElement('textarea');
      t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
