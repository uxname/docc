/* docc's own names on top of them: the fonts, the sizes of the frame, the colours of an edit */
:root{--font:"Geist Variable",ui-sans-serif,system-ui,sans-serif;--mono:"Geist Mono Variable",ui-monospace,sfmono-regular,menlo,monospace;
--top:56px;--bbar:0px;--side:15rem;--outline:13rem;--eds:20rem;--col:42rem;--rail:16rem;--gap:48px;--tgt:32px;--r:6px;
--shadow:0 8px 24px rgb(0 0 0/.1);
--chg:var(--state-edit);--new:var(--state-new);--rem:var(--state-removed);
--ins-bg:color-mix(in oklab,var(--success) 18%,transparent);--del-bg:color-mix(in oklab,var(--destructive) 22%,transparent);
--frag-bg:color-mix(in oklab,var(--state-comment) 22%,transparent);--frag-line:var(--warning-strong);
--hue-bg:color-mix(in oklab,var(--hue) 10%,transparent);--past-bg:color-mix(in oklab,var(--state-past) 18%,transparent)}
[data-theme="dark"]{--shadow:0 8px 24px rgb(0 0 0/.5)}
:root:has(.bbar){--bbar:44px}
@media (pointer:coarse),(max-width:820px){:root{--tgt:44px}}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--top) + 16px);scroll-padding-bottom:calc(var(--bbar) + 16px)}
body{margin:0;padding-bottom:var(--bbar);background:var(--background);color:var(--foreground);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--hue);text-decoration-thickness:1px;text-underline-offset:.15em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
[tabindex="-1"]:focus{outline:0}
.blk.cur>.blk-body,.ghost.cur{outline:2px solid var(--hue);outline-offset:6px;border-radius:2px}
.skip{position:absolute;left:-999px}
.skip:focus{left:1rem;top:1rem;z-index:90;background:var(--background);padding:.5rem 1rem;box-shadow:var(--shadow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.muted{color:var(--muted-foreground);font-size:13px}
.top .short{display:none}
.sp{flex:1}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.noscript{padding:2rem}
/* buttons, as the reader's: 32px, 6px corners, a near-black primary */
button{font:inherit;color:inherit;cursor:pointer}
.ic{flex:none;display:flex;color:var(--muted-foreground)}
.ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tgt);padding:0 12px;font-size:14px;font-weight:500;line-height:1.2;background:var(--background);color:var(--foreground);border:1px solid var(--border);border-radius:var(--r);white-space:nowrap;text-decoration:none}
.btn .ic{color:inherit}
.btn:hover{background:var(--accent)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.btn.pri:hover{opacity:.9}
.btn.flat{background:none;border-color:transparent;padding:0 8px}
.btn.flat:hover{background:var(--accent)}
.btn.ico{min-width:var(--tgt);padding:0}
.btn.sm{min-height:28px;padding:0 10px;font-size:13px}
.btn.sm .ic svg{width:14px;height:14px}
@media (pointer:coarse){.btn.sm{min-height:44px;padding:0 12px;font-size:14px}}
.btn:disabled{opacity:.5;cursor:default}
.btn:disabled:hover{background:var(--background)}
.btn.pri:disabled:hover{background:var(--primary)}
button.link{padding:0;border:0;background:none;color:var(--hue);font-size:13px;min-height:24px}
kbd{padding:0 5px;font:12px/1.5 var(--font);color:var(--muted-foreground);border:1px solid var(--border);border-radius:4px}
.chip{display:inline-flex;align-items:center;padding:0 6px;font-size:12px;font-weight:500;line-height:1.5;border-radius:4px;background:var(--secondary);color:var(--muted-foreground);white-space:nowrap}
.chip.bad{background:color-mix(in oklab,var(--destructive) 14%,transparent);color:var(--destructive)}
/* segmented control: the tabs of the left column and the theme in «⋯» */
.seg{display:flex;gap:2px;padding:3px;background:var(--secondary);border-radius:8px}
.seg>button{flex:1 1 auto;min-width:0;min-height:calc(var(--tgt) - 6px);padding:2px 8px;font-size:13px;line-height:1.2;color:var(--foreground);background:none;border:0;border-radius:5px;white-space:nowrap}
.seg>button[aria-selected=true],.seg>button[aria-pressed=true]{background:var(--background);box-shadow:0 1px 2px rgb(0 0 0/.08);font-weight:500}
.tc{margin-left:2px;font-size:12px;color:var(--muted-foreground)}
/* the bar at the top */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;height:var(--top);padding:0 16px;background:var(--background);color:var(--foreground);border-bottom:1px solid var(--border)}
.proj{display:flex;align-items:center;gap:8px;min-width:0;font-size:16px;font-weight:600;white-space:nowrap}
.proj a{color:inherit;text-decoration:none;overflow:hidden;text-overflow:ellipsis}
.proj .sep{color:var(--muted-foreground);font-weight:400}
.proj small{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:400;color:var(--muted-foreground)}
.srch{font-weight:400}
.pop{margin:0;inset:auto;position:fixed;top:calc(var(--top) - 4px);right:12px;left:auto;width:280px;padding:12px;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow)}
.pop hr{border:0;border-top:1px solid var(--border);margin:10px -12px}
.pop h2{margin:0 0 4px;font-size:13px;font-weight:600}
.pop p{margin:0 0 10px;font-size:13px;color:var(--muted-foreground)}
.pop .pl{margin:10px 0 4px;font-size:12px}
.pop .ver{margin:8px 0 0;font-size:12px;text-align:right}
.mi{display:block;width:100%;min-height:var(--tgt);margin:0 -4px;padding:4px;text-align:left;font-size:13px;background:none;border:0;border-radius:var(--r)}
.mi:hover,.mi:focus-visible{background:var(--accent)}
.mi.bad{color:var(--destructive)}
.send-p .row{gap:6px}
.send-p .send{margin:12px 0 0;padding:10px;background:var(--muted);border:1px solid var(--border);border-radius:8px}
.send-p .send p{color:var(--foreground)}
/* the columns: the tree, the sections (from 1280px), the text */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - var(--top) - var(--bbar))}
.shell.ol{grid-template-columns:var(--side) var(--outline) minmax(0,1fr)}
.shell.eds{grid-template-columns:var(--side) var(--eds) minmax(0,1fr)}
@media (max-width:820px){.shell{display:block}}
#side,#edits,#outline{position:sticky;top:var(--top);height:calc(100vh - var(--top) - var(--bbar));overflow:clip;background:var(--background);border-right:1px solid var(--border);font-size:14px;line-height:1.45}
#outline{overflow:auto;background:var(--muted);padding:16px 12px}
main{min-width:0;padding:40px 32px 64px;outline:0;container:main/inline-size}
.page{max-width:var(--col)}
@media (max-width:820px){main{padding:24px 16px 48px}}
.drawer{margin:0;padding:0;overflow:clip;width:min(calc(100vw - 64px),352px);max-width:none;height:100%;max-height:none;border:0;border-right:1px solid var(--border);background:var(--background);color:var(--foreground);font-size:14px;line-height:1.45}
.drawer::backdrop{background:rgb(0 0 0/.3)}
.drawer[open]{display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(-100%)}}
.side-x{align-self:flex-end;margin:8px 8px 0}
.side-in{display:flex;flex-direction:column;height:100%}
.drawer .side-in{flex:1;min-height:0}
.side-top{padding:12px 12px 0}
.side-brand{display:none}
@media (max-width:820px){.side-brand{display:block;margin-bottom:12px}}
.banner{margin:0 0 10px;padding:6px 10px;font-size:13px;border-radius:var(--r);background:var(--past-bg);color:var(--foreground)}
.panel{flex:1;min-height:0;overflow:hidden auto;padding:8px 12px 24px}
.side-ol{flex:none;max-height:40%;overflow:auto;padding:12px;background:var(--muted);border-top:1px solid var(--border)}
.pad{padding:4px 0}
/* the sections of the page */
.outline ul{margin:0;padding:0;list-style:none}
.ol-h{margin:0 8px 8px;font-size:12px;font-weight:500;color:var(--muted-foreground)}
.outline a{display:flex;align-items:center;min-height:var(--tgt);padding:4px 8px;border-radius:var(--r);color:var(--muted-foreground);text-decoration:none;line-height:1.35}
.outline a.l3{padding-left:20px;font-size:13px}
.outline a:hover{background:var(--accent);color:var(--foreground)}
.outline a.on{background:var(--secondary);color:var(--foreground)}
/* the search, in a dialog over the page */
.search-d{width:min(36rem,calc(100vw - 16px));max-height:min(80vh,40rem);margin:10vh auto auto;padding:8px;color:var(--foreground);background:var(--popover);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);overflow:auto}
.search-d::backdrop{background:rgb(0 0 0/.3)}
@media (max-width:820px){.search-d{margin-top:8px}}
#q{width:100%;min-height:40px;padding:0 12px;font:inherit;font-size:16px;color:inherit;background:var(--background);border:1px solid var(--input-border);border-radius:var(--r)}
#q:focus{outline:2px solid var(--focus);outline-offset:-1px}
#results{margin:6px 0 0}
#results ul{margin:0;padding:0;list-style:none}
#results .count{margin:4px 8px;color:var(--muted-foreground);font-size:12px}
#results li{padding:8px;border-radius:var(--r);cursor:pointer}
#results li[aria-selected=true],#results li:hover{background:var(--accent)}
#results b{display:block;font-weight:600}
#results span{display:block;color:var(--muted-foreground);font-size:13px;overflow-wrap:anywhere}
#results mark{background:var(--frag-bg);color:inherit;border-radius:2px}
/* the tree */
#tree ul{margin:0;padding:0;list-style:none}
#tree ul ul{margin-left:14px;padding-left:6px;border-left:1px solid var(--border)}
#tree li{position:relative}
#tree a{display:flex;align-items:center;gap:6px;min-height:var(--tgt);padding:4px 8px;border-radius:var(--r);color:var(--foreground);text-decoration:none}
#tree a:has(+.tw){padding-right:24px}
#tree a>.tt{flex:1;min-width:0}
#tree a:hover{background:var(--accent)}
#tree .fd{display:flex;align-items:center;gap:6px;width:100%;min-height:var(--tgt);padding:4px 8px;border:0;border-radius:var(--r);background:none;color:var(--foreground);font:inherit;text-align:left;cursor:pointer}
#tree .fd>.tt{flex:1;min-width:0}
#tree .fd:hover:not(:disabled){background:var(--accent)}
#tree .fd:disabled{cursor:default;opacity:1}
#tree a[aria-current=page]{background:var(--secondary);font-weight:500}
#tree a[aria-current=page] .ic{color:var(--foreground)}
#tree .ic svg{width:14px;height:14px}
.cc{flex:none;display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted-foreground)}
.cc .ic svg{width:13px;height:13px}
/* edits between the ends of the timeline, as the file status of an IDE: the title in the colour of the
   kind and beside it the number of edits, + for a new page, a dot on a folded page with edits inside */
#tree a.m-chg>.tt{color:var(--chg)}
#tree a.m-new>.tt{color:var(--new)}
.tm{flex:none;min-width:1.25rem;padding:0 4px;font-size:11px;font-weight:600;line-height:1.5;text-align:center;border:1px solid currentColor;border-radius:4px}
.tm.chg{color:var(--chg)}.tm.new{color:var(--new)}
.td{flex:none;width:7px;height:7px;margin:0 4px;border-radius:50%;background:var(--chg)}
.ebar{display:flex;width:100%;margin:0 0 8px;gap:6px}
.eds-in{display:flex;flex-direction:column;height:100%}
.eds-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border-bottom:1px solid var(--border)}
.eds-h h2{margin:0;font-size:14px;font-weight:600}
.tw{position:absolute;right:2px;top:calc((var(--tgt) - 1.5rem) / 2);width:1.5rem;height:1.5rem;padding:0;border:0;background:none;color:var(--muted-foreground);border-radius:4px}
.tw:hover{background:var(--accent)}
@media (pointer:coarse){.tw{width:44px;height:44px;top:0;right:0}#tree a:has(+.tw){padding-right:44px}}
.tw::before{content:"▾";display:block;transition:transform .12s}
.tw[aria-expanded=false]::before{transform:rotate(-90deg)}
.more{display:block;width:100%;min-height:var(--tgt);margin-top:4px;padding:4px;font:inherit;font-size:13px;color:var(--muted-foreground);background:none;border:1px dashed var(--border);border-radius:var(--r)}
.more:hover{background:var(--accent);color:var(--foreground)}
/* the edits of the page and the comments, in the left column */
.left{margin:4px 0;font-weight:600}
.eh{margin:8px 8px 2px;font-size:11px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edits,.clist{margin:0;padding:0;list-style:none}
.edits .er{align-items:center}
.edits .et{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad>.es{margin:0 0 8px}
.nx{display:flex;justify-content:space-between;width:100%;min-height:auto;margin-top:12px;padding:8px 10px;text-align:left;white-space:normal}
.nx small{display:block;color:var(--muted-foreground);font-weight:400}
.nx>span:first-child{font-weight:600}
.er,.cr{display:flex;gap:8px;width:100%;min-height:var(--tgt);padding:6px 8px;text-align:left;font-size:13px;line-height:1.4;background:none;border:0;border-radius:var(--r)}
.er:hover,.cr:hover,.er.on{background:var(--accent)}
.g{flex:none;align-self:flex-start;padding:0 5px;font-size:11px;font-weight:600;line-height:1.6;border-radius:4px;background:var(--secondary)}
.es{color:var(--muted-foreground);font-size:12px}
.g.chg{color:var(--chg)}.g.new{color:var(--new)}.g.rm{color:var(--rem)}
.cr{flex-direction:column;align-items:stretch;gap:2px;padding:10px 4px;border-bottom:1px solid var(--border);border-radius:0}
.cr .meta{margin:0;font-size:12px}
.cpg{font-size:14px;font-weight:600}
.cr .fq{margin:2px 0;font-style:normal}
.cp{color:var(--muted-foreground);font-size:12px}
.ctx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cg>summary{list-style:none;cursor:pointer}
.cg>summary::-webkit-details-marker{display:none}
.cg[open]>summary .ctx{display:block}
.cg[open]{padding:0 4px 10px;border-bottom:1px solid var(--border)}
.cg[open]>summary{margin:0 -4px;border-bottom:0}
.lostc .clist{margin-top:4px}
.lostc li{padding:2px 0}
.cg .fq{white-space:pre-line;margin:2px 0 8px}
.cg>.cp{margin:6px 0 0}
/* the page: 16px text at 1.65, headings 30, 22, 18 */
.page{font-size:16px;line-height:1.65}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted-foreground);margin-bottom:6px}
.crumbs a{color:var(--muted-foreground);text-decoration:none}
.crumbs a:hover{color:var(--foreground);text-decoration:underline}
h1{margin:0 0 24px;font-size:30px;line-height:1.2;letter-spacing:-.01em;font-weight:700}
@media (max-width:820px){h1{font-size:28px}}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:-16px 0 24px}
.shell.work .page>:not(.doc),.shell.work .ghost{max-width:var(--col)}
.doc{overflow-wrap:break-word}
.blk-body p,.blk-body ul,.blk-body ol,.blk-body table,.blk-body pre,.blk-body blockquote{margin:0 0 1rem}
.blk-body h2{position:relative;margin:2.5rem 0 .8rem;font-size:22px;line-height:1.3;font-weight:600}
.blk-body h3{position:relative;margin:1.8rem 0 .6rem;font-size:18px;line-height:1.4;font-weight:600}
.blk-body h4{position:relative;margin:1.4rem 0 .5rem;font-size:16px;font-weight:600}
.anchor{position:absolute;left:-1.1rem;color:var(--muted-foreground);text-decoration:none;font-weight:600;opacity:0}
:is(h2,h3,h4):hover>.anchor,.anchor:focus{opacity:1}
@media (max-width:820px){.anchor{display:none}}
.blk-body li{margin:.25rem 0}
.blk-body ul,.blk-body ol{padding-left:1.5rem}
.blk-body li>ul,.blk-body li>ol{margin:.25rem 0}
code,pre,.mmd-err{font-family:var(--mono);font-size:14px}
code{padding:.1em .35em;background:var(--muted);border-radius:4px}
pre{position:relative;padding:.9rem 1rem;overflow-x:auto;background:var(--muted);border:1px solid var(--border);border-radius:8px;line-height:1.55}
pre code{padding:0;background:none}
.mmd{margin:0 0 1rem;overflow-x:auto;text-align:center}
.mmd svg{display:block;max-width:100%;height:auto;margin:0 auto}
.hblk{display:block;width:100%;height:0;margin:0 0 1rem;border:0}
.mmd-err{margin:-.5rem 0 1rem;color:var(--destructive);white-space:pre-wrap;font-size:13px}
.blk-body img{max-width:100%;height:auto;vertical-align:middle}
[data-theme="dark"] .blk-body img{background:#fff;border-radius:4px}
.copy{position:absolute;top:.4rem;right:.4rem;padding:.15rem .55rem;font:inherit;font-family:var(--font);font-size:12px;color:var(--muted-foreground);background:var(--background);border:1px solid var(--border);border-radius:var(--r);opacity:0}
pre:hover .copy,pre:focus-within .copy,.copy:focus{opacity:1}
@media (pointer:coarse){.copy{opacity:1;min-height:44px}}
table{display:block;max-width:100%;overflow-x:auto;outline-offset:2px;border-collapse:collapse;font-size:14px}
th{background:var(--muted);font-weight:600}
th,td{padding:.5rem .8rem;border:1px solid var(--border);text-align:left;vertical-align:top}
blockquote{padding:.6rem 1rem;border-left:4px solid var(--border);background:var(--muted);border-radius:0 8px 8px 0}
blockquote p{margin:0}
.props{margin:0 0 1.6rem;padding:.5rem 1rem;background:var(--card);border:1px solid var(--border);border-radius:8px}
.props .blk{margin-bottom:0}
.prop{display:grid;grid-template-columns:minmax(7rem,12rem) minmax(0,1fr);gap:1rem;padding:.35rem 0}
.prop p{margin:0}
.pk{color:var(--muted-foreground);font-size:14px;padding-top:.1rem}
@media (max-width:640px){.prop{grid-template-columns:1fr;gap:0}}
.rh{margin:3rem 0 .8rem;font-size:12px;font-weight:500;color:var(--muted-foreground)}
.rows{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.rows .row{display:block;padding:12px 16px;color:inherit;text-decoration:none;border-top:1px solid var(--border)}
.rows .row:first-child{border-top:0}
.rows .row:hover{background:var(--accent)}
.ct{font-weight:600;color:var(--foreground)}
.cs{display:block;margin-top:2px;font-size:14px;line-height:1.5;color:var(--muted-foreground)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:3rem}
.pn a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;text-decoration:none;color:var(--foreground);border:1px solid var(--border);border-radius:8px}
.pn a:hover{background:var(--accent)}
.pn small{color:var(--muted-foreground);font-size:12px}
.pn span{font-weight:600}
.pn .next{grid-column:2;text-align:right}
@media (max-width:820px){.pn{grid-template-columns:1fr}.pn .next{grid-column:1}}
.notice{margin:0 0 1.2rem;padding:10px 14px;font-size:14px;background:var(--past-bg);border-radius:8px}
/* blocks: the code above the text (in the margin when the column has one), the comment cards beside it (under it when narrow) */
.blk{position:relative;border-radius:4px;margin-bottom:1rem}
.code-bar{display:none;position:absolute;right:0;bottom:100%;z-index:3;gap:10px;align-items:center;padding:0 6px;font-size:12px;line-height:1.7;background:var(--background);border:1px solid var(--border);border-radius:4px}
.blk:hover>.code-bar,.blk:focus-within>.code-bar,.blk.cur>.code-bar{display:flex}
.code-bar .code{font-family:var(--mono);color:var(--muted-foreground)}
@media print{.code-bar{display:none!important}}
.num{display:block;font:12px/1.25rem var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--muted-foreground);white-space:nowrap;user-select:all}
@container main (min-width:56rem){.page{padding-left:3.5rem}.num{position:absolute;right:100%;top:.2rem;margin-right:.75rem}}
.blk-body>:last-child{margin-bottom:0}
.blk.flash>.blk-body,.ghost.flash{background:var(--hue-bg);transition:background .6s}
@container main (min-width:760px){
.shell.work .page{max-width:calc(var(--col) + var(--gap) + var(--rail))}
.shell.work .blk{display:grid;grid-template-columns:minmax(0,var(--col)) var(--rail);column-gap:var(--gap);align-items:start}
.shell.work .blk>.old,.shell.work .blk>.blk-body{grid-column:1}
.shell.work .blk>.num{grid-column:1}
.shell.work .blk-side{grid-column:2;grid-row:1 / span 3;height:0;overflow:visible;position:relative;z-index:2}
.shell.work .doc{padding-bottom:4rem}
}
@container main (min-width:56rem){.shell.work .page{max-width:calc(var(--col) + var(--gap) + var(--rail) + 3.5rem)}}
.blk-side{display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.5}
.blk-side:empty{display:none}

<script>
// The documentation application: one page at a time drawn from the JSON

  // A formatter is made once per options: making one costs more than the
  // whole list of saves, which used to make thousands of them on every step.
  var fmts = {};

  }

  }
  // the exact moment of a version, «14 Oct 2026, 21:40»
  function exact(c) { return fmt(c, { dateStyle: 'medium', timeStyle: 'short' }) || 'not saved yet'; }

    return (s || '').split(/(```[\s\S]*?```|`[^`\n]+`)/).map(function (t, i) {

        return byId[id] ? byId[id].title : id;

      .replace(/\{\{([^}#]+)#[^}]*\}\}/g, function (m, id) { return '«' + (byId[id] ? byId[id].title : id) + '»'; })

  }

  }

  }

      }
    }
    var out = [];
    i = 0; j = 0;
    while (i < n && j < m) {
      if (x[i] === y[j]) { out.push([0, j, i]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push([-1, i]); i++; }

    var title = page !== pages[0] && page.title;
    return html`
      <a class="skip" href="#main" onClick=${function (e) { e.preventDefault(); var m = document.getElementById('main'); m.focus(); m.scrollIntoView(); }}>Skip to content</a>
      <header class="top" role="banner">
        ${!desk[0] && html`<button id="menu" type="button" class="btn flat ico" aria-label="Menu" aria-expanded=${drawer[0] ? 'true' : 'false'} onClick=${function () { drawer[1](true); }}><${Icon} name="menu" /></button>`}
        <div class="proj">${D.brand.head && html`<span dangerouslySetInnerHTML=${{ __html: D.brand.head }}></span>`}<a href=${'#' + pages[0].id}>${D.title}</a>
          ${title && html`<span class="sep" aria-hidden="true">›</span><small>${title}</small>`}</div>
        <span class="sp"></span>
        <button type="button" class="btn srch" aria-label="Search" title="Search ( / )" onClick=${goSearch}><${Icon} name="search" /><span class="wide">Search</span><kbd class="wide">/</kbd></button>
        <${Send} comments=${comments} />
        <${More} reset=${resetAll} name=${function () { askName[1](true); }} theme=${themeV[0]} setTheme=${setTheme} />
      </header>
      <div class=${'shell' + (rail ? ' work' : '') + (eds ? ' eds' : wide[0] ? ' ol' : '')}>
        ${desk[0] ? html`<aside id="side" aria-label="Navigation">${side}</aside>
          ${eds && html`<aside id="edits" aria-labelledby="eds-h"><${EditsPanel} ...${sideProps} wide=${true} close=${toggleEdits} /></aside>`}
          ${wide[0] && !eds && html`<aside id="outline"><${Outline} toc=${toc[0]} spy=${spy[0]} picked=${picked} /></aside>`}`
          : html`<dialog id="drawer" ref=${dr} class="drawer" aria-label="Navigation" onClose=${closeDrawer}
              onClick=${function (e) { if (e.target === dr.current) { dr.current.close(); } }}>
              <button type="button" class="btn flat sm side-x" onClick=${function () { dr.current.close(); }}><${Icon} name="x" />Close</button>
              ${drawer[0] && side}</dialog>`}
        <main id="main" tabindex="-1">
          <${Page} key=${page.id + ':' + dark[0]} page=${page} comments=${comments} s=${s} t=${t} setT=${setT} onToc=${setToc} missing=${r[0].missing}
            cur=${curA} editor=${editor[0]} closeEditor=${function () { editor[1](null); }} activeC=${activeC[0]} />
        </main>
      </div>
      ${last > 0 && html`<${When} page=${page} s=${s} t=${t} setRange=${setRange} />`}
      ${frag[0] && coarse && html`<div class="nav" role="region" aria-label="Comment on the selection">
        <button type="button" class="btn pri" onMouseDown=${function (e) { e.preventDefault(); }} onClick=${commentSel}><${Icon} name="comment" />Comment on the selection</button></div>`}
      ${frag[0] && !coarse && html`<button type="button" class="btn pri fragb" style=${'left:' + Math.min(frag[0].x, window.innerWidth - 220) + 'px;top:' + (frag[0].y + 8) + 'px'}
        onMouseDown=${function (e) { e.preventDefault(); }} onClick=${commentSel}><${Icon} name="comment" />Comment on the selection</button>`}
      ${finding[0] && html`<${SearchDialog} q=${q} close=${function () { finding[1](false); }} go=${function (h) { r[1](route(h)); }} />`}
      ${askName[0] && html`<${NameDialog} close=${function () { askName[1](false); }} />`}
      <${Toast} />`;
  }

  // the pure parts, for app_test.js; nothing else sets this
  if (window.doccTest) { window.doccTest({ wordMarks: wordMarks, words: words, plain: plain, snip: snip, findFragment: findFragment, placeGhost: placeGhost, pageDelta: pageDelta, between: between,
    saveDays: saveDays, atDate: atDate, pathOf: pathOf, answersFor: answersFor, splitAnswer: splitAnswer, joinAnswer: joinAnswer,
    fieldAnswer: fieldAnswer, answerOk: answerOk, fieldProblem: fieldProblem, authorNow: authorNow, store: store, dirtyFields: dirtyFields, leave: leave, markPassed: markPassed, answerWords: answerWords, fieldState: fieldState, exportJSON: exportJSON, fieldWords: fieldWords, thumbFor: thumbFor, pageMarks: pageMarks, allChanges: allChanges, commentPlace: commentPlace, lostOn: lostOn, nest: nest, pageEdits: pageEdits, nextEdited: nextEdited, route: route, frameDoc: frameDoc, FRAME_SANDBOX: FRAME_SANDBOX }); return; }
  applyTheme(store('theme'));
  render(html`<${App} />`, document.getElementById('app'));
})();

</script>
