[package]
name = "docc"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22.1"
comrak = { version = "0.56.0", default-features = false }
flate2 = "1.1.10"
hex = "0.4.3"
icu_collator = "2.3.1"
jsonschema = { version = "0.58.6", default-features = false }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
unicode-normalization = "0.1.25"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
url = "2.5.8"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
